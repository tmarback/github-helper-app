name: CI checks

on:
  workflow_call:

env:
  BUILD_GO_VERSION: 1.26

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.BUILD_GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.BUILD_GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download
      - name: Build project
        run: go build -v ./...
      - name: Run tests
        run: go test ./...
